# Inferno ALSA virtual soundcard for PI9696 (installed as /etc/asound.conf)
#
# Deliberately minimal: every setting is left to inferno's own Rust defaults
# (SAMPLE_RATE=48000, NAME derived from app name + IP) or supplied per-instance
# via INFERNO_* environment variables.
#
# Do NOT add bare `NAME $NAME`-style keys here to customise a single instance:
# inferno_aoip merges the ALSA config first and only fills *gaps* from the
# environment (`config.entry(key).or_insert(env_value)`), so any key present
# here wins over the env var and an empty expansion makes numeric settings
# panic on parse. Keys must stay absent for env overrides to take effect.
pcm.inferno {
	type inferno
	hint {
		show on
		description "Inferno ALSA virtual device"
	}
}
