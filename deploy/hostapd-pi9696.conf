# systemd drop-in for hostapd.service, installed by docs/install.sh as
# /etc/systemd/system/hostapd.service.d/pi9696.conf.
#
# The app writes its access point settings to /etc/hostapd/pi9696.conf and
# turns the AP on and off with `systemctl enable|disable --now hostapd`
# (applyWifiConfig in main.go). The stock unit only starts with
# /etc/hostapd/hostapd.conf, so point it at the app's file instead.
[Unit]
ConditionFileNotEmpty=
ConditionFileNotEmpty=/etc/hostapd/pi9696.conf

[Service]
Environment=DAEMON_CONF=/etc/hostapd/pi9696.conf
